name: tests

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # I-Simpa embeds Python 3.8.1, so the tools MUST run there.
          # 3.8 is end of life and is not in the tool cache on newer
          # runners, hence the pinned 22.04 image.
          - os: ubuntu-22.04
            python: "3.8"
          # A current interpreter, to catch anything that only breaks on
          # newer Python.
          - os: ubuntu-latest
            python: "3.14"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Environment
        run: |
          python -c "import sys; print('python :', sys.version)"
          python -m pip --version
          python -m pytest --version

      # On failure the pytest output is re-emitted as a workflow error
      # annotation. Job logs need an authenticated API call to retrieve,
      # whereas annotations are readable from the public check-runs
      # endpoint -- so this makes a red build diagnosable by anyone.
      - name: Run the test suite
        run: |
          set +e
          python -m pytest tests/ -q --tb=short > pytest-output.txt 2>&1
          code=$?
          cat pytest-output.txt
          if [ $code -ne 0 ]; then
            msg=$(tail -c 3000 pytest-output.txt | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=pytest failed on Python ${{ matrix.python }}::$msg"
          fi
          exit $code

      # The tools themselves are loaded by I-Simpa's embedded interpreter,
      # not imported by the tests, so a syntax error in one could otherwise
      # reach a user unnoticed. This compiles every file on the target
      # interpreter.
      - name: Byte-compile the tools for this interpreter
        if: always()
        run: |
          set +e
          python -m compileall -q UserScript > compile-output.txt 2>&1
          code=$?
          cat compile-output.txt
          if [ $code -ne 0 ]; then
            msg=$(tail -c 2000 compile-output.txt | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=compileall failed on Python ${{ matrix.python }}::$msg"
          fi
          exit $code
